name: 6-Hour Continuous Service (as-wa-bot)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: as-wa-bot-singleton
  cancel-in-progress: true

jobs:
  wa-bot:
    name: Run WhatsApp Nemotron Bot (6h Cycle)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 355

    env:
      PORT: "3000"
      RESTART_INTERVAL_SECONDS: "19800"
      GH_PAT: ${{ secrets.GH_PAT }}
      NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
      NIM_MODEL: "nvidia/nemotron-3.5-bolt-e4b"

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Node.js 20 & Python 3.11
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 2b. Set up Python for Retrigger Script
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          npm install

      - name: 4. Start Managed WhatsApp Bot (~5.5-Hour Active Session)
        run: |
          chmod +x scripts/start_server.sh
          ./scripts/start_server.sh

      - name: 5. Retrigger Next 6-Hour Cycle
        if: always()
        run: |
          python scripts/retrigger_workflow.py
